<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Inn — Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* LOGIN */
    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #df2027, #f7c600);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      text-align: center;
      animation: pop .5s ease;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .login-box h1 {
      color: #df2027;
      margin-bottom: 5px;
    }

    .login-box p {
      color: #777;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #df2027;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #df2027;
      color: white;
      font-size: 17px;
      font-weight: bold;
      transition: .2s;
    }

    .login-btn:hover {
      background: #b9161c;
      transform: translateY(-2px);
    }

    #loginError {
      margin-top: 15px;
      color: #df2027;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ADMIN */
    #adminPage {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #201d1d;
      color: white;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    .header-inner {
      max-width: 1400px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 35px;
    }

    .brand h1 {
      font-size: 22px;
    }

    .brand small {
      display: block;
      color: #f7c600;
      margin-top: 2px;
    }

    .logout-btn {
      background: #df2027;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #b9161c;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      position: relative;
      overflow: hidden;
    }

    .stat::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      right: -25px;
      top: -25px;
      background: #f7c600;
      border-radius: 50%;
      opacity: .25;
    }

    .stat h3 {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 30px;
      color: #df2027;
    }

    /* FILTERS */
    .toolbar {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: 10px 15px;
      border-radius: 8px;
      background: #eee;
      color: #333;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #df2027;
      color: white;
    }

    .refresh-btn {
      margin-left: auto;
      padding: 10px 15px;
      background: #201d1d;
      color: white;
      border-radius: 8px;
      font-weight: bold;
    }

    /* ORDERS */
    #ordersContainer {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .order-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.09);
      border-left: 6px solid #f7c600;
      animation: slideUp .35s ease;
    }

    .order-card.new {
      border-left-color: #df2027;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    .order-number {
      color: #df2027;
      font-size: 21px;
      font-weight: bold;
    }

    .order-time {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-new {
      background: #ffe1e1;
      color: #df2027;
    }

    .status-preparing {
      background: #fff0b3;
      color: #8a6800;
    }

    .status-ready {
      background: #dff7e6;
      color: #16833a;
    }

    .status-delivered {
      background: #dceeff;
      color: #1769aa;
    }

    .status-cancelled {
      background: #eee;
      color: #555;
    }

    .customer {
      background: #fafafa;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .customer strong {
      color: #df2027;
    }

    .items {
      margin-bottom: 15px;
    }

    .items h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed #ddd;
    }

    .item-name {
      font-weight: bold;
    }

    .item-option {
      color: #777;
      font-size: 13px;
      display: block;
      margin-top: 2px;
    }

    .item-price {
      white-space: nowrap;
      font-weight: bold;
    }

    .total {
      display: flex;
      justify-content: space-between;
      padding: 13px;
      border-radius: 10px;
      background: #fff7cc;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .action-btn {
      padding: 11px 8px;
      border-radius: 8px;
      font-weight: bold;
      color: white;
    }

    .prepare {
      background: #d89b00;
    }

    .ready {
      background: #16833a;
    }

    .deliver {
      background: #1769aa;
    }

    .cancel {
      background: #555;
    }

    .action-btn:hover {
      opacity: .85;
      transform: translateY(-1px);
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      padding: 60px 20px;
      text-align: center;
      border-radius: 18px;
      color: #777;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    /* POPUP */
    #popup {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 330px;
      background: #201d1d;
      color: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      display: none;
      z-index: 9999;
      animation: popup .4s ease;
    }

    #popup.show {
      display: block;
    }

    #popup h3 {
      color: #f7c600;
      margin-bottom: 5px;
    }

    #popup button {
      margin-top: 12px;
      background: #df2027;
      color: white;
      padding: 8px 14px;
      border-radius: 7px;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.9);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 5px solid #eee;
      border-top-color: #df2027;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    /* ANIMATIONS */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      #ordersContainer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand small {
        font-size: 11px;
      }

      .logout-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        padding: 15px;
      }

      .stat strong {
        font-size: 24px;
      }

      .toolbar {
        padding: 10px;
      }

      .filter-btn {
        font-size: 12px;
        padding: 8px 10px;
      }

      .refresh-btn {
        margin-left: 0;
      }

      .order-card {
        padding: 15px;
      }

      #popup {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div id="loading">
    <div class="loader"></div>
    <strong>Loading...</strong>
  </div>

  <!-- LOGIN PAGE -->
  <section id="loginPage">

    <div class="login-box">

      <div class="logo">🍕</div>

      <h1>Pizza Inn</h1>
      <p>Admin Order Management</p>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="login-btn" id="loginBtn">
        🔐 Login
      </button>

      <div id="loginError"></div>

    </div>

  </section>


  <!-- ADMIN PAGE -->
  <section id="adminPage">

    <header>

      <div class="header-inner">

        <div class="brand">
          <div class="brand-icon">🍕</div>

          <div>
            <h1>Pizza Inn Admin</h1>
            <small>Layyah • Live Orders</small>
          </div>
        </div>

        <button class="logout-btn" id="logoutBtn">
          Logout
        </button>

      </div>

    </header>


    <main class="container">

      <!-- STATS -->
      <div class="stats">

        <div class="stat">
          <h3>New Orders</h3>
          <strong id="newCount">0</strong>
        </div>

        <div class="stat">
          <h3>Preparing</h3>
          <strong id="preparingCount">0</strong>
        </div>

        <div class="stat">
          <h3>Ready</h3>
          <strong id="readyCount">0</strong>
        </div>

        <div class="stat">
          <h3>Today's Sales</h3>
          <strong id="todaySales">Rs. 0</strong>
        </div>

      </div>


      <!-- TOOLBAR -->
      <div class="toolbar">

        <button class="filter-btn active" data-filter="all">
          All
        </button>

        <button class="filter-btn" data-filter="new">
          New
        </button>

        <button class="filter-btn" data-filter="preparing">
          Preparing
        </button>

        <button class="filter-btn" data-filter="ready">
          Ready
        </button>

        <button class="filter-btn" data-filter="delivered">
          Delivered
        </button>

        <button class="filter-btn" data-filter="cancelled">
          Cancelled
        </button>

        <button class="refresh-btn" id="refreshBtn">
          🔄 Refresh
        </button>

      </div>


      <!-- ORDERS -->
      <div id="ordersContainer">

        <div class="empty">
          <div class="empty-icon">🍕</div>
          <h2>Loading Orders...</h2>
          <p>Please wait.</p>
        </div>

      </div>

    </main>

  </section>


  <!-- NEW ORDER POPUP -->
  <div id="popup">

    <h3>🔔 New Order!</h3>

    <div id="popupText">
      New order received.
    </div>

    <button onclick="closePopup()">
      OK
    </button>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      updateDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==========================================
       FIREBASE CONFIG
       ========================================== */

    const firebaseConfig = {

      apiKey: "AIzaSyB7BB5goAsfoaJfLONsk4hbPJKLRLiEBRw",

      authDomain: "pizzainnlayyah.firebaseapp.com",

      projectId: "pizzainnlayyah",

      storageBucket: "pizzainnlayyah.firebasestorage.app",

      messagingSenderId: "646104115309",

      appId: "1:646104115309:web:92bdc9d7a5549068337764",

      measurementId: "G-5QLLC0TLRK"

    };


    /* ==========================================
       INITIALIZE FIREBASE
       ========================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ==========================================
       ELEMENTS
       ========================================== */

    const loginPage = document.getElementById("loginPage");

    const adminPage = document.getElementById("adminPage");

    const loginBtn = document.getElementById("loginBtn");

    const logoutBtn = document.getElementById("logoutBtn");

    const emailInput = document.getElementById("email");

    const passwordInput = document.getElementById("password");

    const loginError = document.getElementById("loginError");

    const ordersContainer =
      document.getElementById("ordersContainer");

    const loading =
      document.getElementById("loading");


    /* ==========================================
       VARIABLES
       ========================================== */

    let allOrders = [];

    let currentFilter = "all";

    let firstSnapshot = true;


    /* ==========================================
       LOGIN
       ========================================== */

    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      const password = passwordInput.value;

      loginError.textContent = "";

      if (!email || !password) {

        loginError.textContent =
          "⚠️ Email aur password dono enter karein.";

        return;

      }


      try {

        loading.style.display = "flex";

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

      catch (error) {

        console.error(error);

        loginError.textContent =
          "❌ " + (error.code || error.message);

      }

      finally {

        loading.style.display = "none";

      }

    });


    /* ENTER KEY LOGIN */

    passwordInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {

        loginBtn.click();

      }

    });


    /* ==========================================
       AUTH STATE
       ========================================== */

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginPage.style.display = "none";

        adminPage.style.display = "block";

        startOrdersListener();

      }

      else {

        loginPage.style.display = "flex";

        adminPage.style.display = "none";

      }

    });


    /* ==========================================
       LOGOUT
       ========================================== */

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    /* ==========================================
       ORDERS LISTENER
       ========================================== */

    function startOrdersListener() {

      const ordersQuery = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );


      onSnapshot(
        ordersQuery,

        (snapshot) => {

          const newOrders = [];

          snapshot.forEach((documentSnapshot) => {

            newOrders.push({

              id: documentSnapshot.id,

              ...documentSnapshot.data()

            });

          });


          /* NEW ORDER SOUND */

          if (!firstSnapshot && newOrders.length > allOrders.length) {

            playNewOrderSound();

            showNewOrderPopup(
              newOrders[0]
            );

            sendBrowserNotification(
              newOrders[0]
            );

          }


          allOrders = newOrders;

          firstSnapshot = false;

          updateStats();

          renderOrders();

        },

        (error) => {

          console.error(
            "Firestore error:",
            error
          );

          ordersContainer.innerHTML = `

            <div class="empty">

              <div class="empty-icon">⚠️</div>

              <h2>Orders Load Error</h2>

              <p>
                ${escapeHtml(error.message)}
              </p>

            </div>

          `;

        }

      );

    }


    /* ==========================================
       UPDATE STATS
       ========================================== */

    function updateStats() {

      let newCount = 0;

      let preparingCount = 0;

      let readyCount = 0;

      let sales = 0;


      const today = new Date();

      const todayDate =
        today.toDateString();


      allOrders.forEach((order) => {

        if (order.status === "new") {

          newCount++;

        }

        if (order.status === "preparing") {

          preparingCount++;

        }

        if (order.status === "ready") {

          readyCount++;

        }


        if (
          order.status !== "cancelled"
          &&
          order.status !== "new"
        ) {

          let orderDate = null;

          try {

            if (order.createdAt?.toDate) {

              orderDate =
                order.createdAt.toDate();

            }

          }

          catch (e) {}


          if (
            orderDate &&
            orderDate.toDateString() === todayDate
          ) {

            sales += Number(order.total || 0);

          }

        }

      });


      document.getElementById(
        "newCount"
      ).textContent = newCount;


      document.getElementById(
        "preparingCount"
      ).textContent = preparingCount;


      document.getElementById(
        "readyCount"
      ).textContent = readyCount;


      document.getElementById(
        "todaySales"
      ).textContent =
        "Rs. " + sales.toLocaleString();

    }


    /* ==========================================
       RENDER ORDERS
       ========================================== */

    function renderOrders() {

      let orders = [...allOrders];


      if (currentFilter !== "all") {

        orders =
          orders.filter(
            order =>
              order.status === currentFilter
          );

      }


      if (!orders.length) {

        ordersContainer.innerHTML = `

          <div class="empty">

            <div class="empty-icon">🍕</div>

            <h2>No Orders Found</h2>

            <p>
              Is filter mein abhi koi order nahi hai.
            </p>

          </div>

        `;

        return;

      }


      ordersContainer.innerHTML =
        orders.map(createOrderCard).join("");

    }


    /* ==========================================
       ORDER CARD
       ========================================== */

    function createOrderCard(order) {

      const status =
        order.status || "new";


      const statusClass =
        "status-" + status;


      const created =
        formatDate(order.createdAt);


      const orderNumber =
        order.orderNumber ||
        order.id.substring(0, 8);


      const itemsHtml =
        (order.items || [])
          .map(item => `

            <div class="item">

              <div>

                <span class="item-name">
                  ${escapeHtml(item.name || "")}
                </span>

                ${
                  item.option
                  ?
                  `<span class="item-option">
                    ${escapeHtml(item.option)}
                  </span>`
                  :
                  ""
                }

                <span class="item-option">
                  Qty: ${Number(item.quantity || 1)}
                </span>

              </div>

              <div class="item-price">
                Rs.
                ${Number(
                  item.subtotal ||
                  (
                    Number(item.price || 0)
                    *
                    Number(item.quantity || 1)
                  )
                ).toLocaleString()}
              </div>

            </div>

          `)
          .join("");


      let orderType =
        order.orderType || "dine-in";


      let typeText = {

        "dine-in": "🍽️ Dine In",

        "takeaway": "🥡 Takeaway",

        "delivery": "🛵 Delivery"

      }[orderType] || orderType;


      return `

        <div class="order-card ${status === "new" ? "new" : ""}">

          <div class="order-top">

            <div>

              <div class="order-number">
                #${escapeHtml(orderNumber)}
              </div>

              <div class="order-time">
                ${created}
              </div>

            </div>

            <div class="status ${statusClass}">
              ${escapeHtml(status)}
            </div>

          </div>


          <div class="customer">

            <div>
              👤 <strong>Customer:</strong>
              ${escapeHtml(order.customerName || "-")}
            </div>

            <div>
              📞 <strong>Phone:</strong>
              ${escapeHtml(order.phone || "-")}
            </div>

            <div>
              🍴 <strong>Type:</strong>
              ${escapeHtml(typeText)}
            </div>

            ${
              order.tableNumber
              ?
              `
              <div>
                🪑 <strong>Table:</strong>
                ${escapeHtml(order.tableNumber)}
              </div>
              `
              :
              ""
            }

            ${
              order.address
              ?
              `
              <div>
                📍 <strong>Address:</strong>
                ${escapeHtml(order.address)}
              </div>
              `
              :
              ""
            }

            ${
              order.notes
              ?
              `
              <div>
                📝 <strong>Notes:</strong>
                ${escapeHtml(order.notes)}
              </div>
              `
              :
              ""
            }

          </div>


          <div class="items">

            <h3>🛒 Order Items</h3>

            ${
              itemsHtml ||
              "<p>No items found.</p>"
            }

          </div>


          <div class="total">

            <span>Total</span>

            <span>
              Rs.
              ${Number(
                order.total || 0
              ).toLocaleString()}
            </span>

          </div>


          <div class="actions">

            ${
              status !== "preparing"
              &&
              status !== "delivered"
              &&
              status !== "cancelled"
              ?
              `
              <button
                class="action-btn prepare"
                onclick="changeStatus('${order.id}', 'preparing')"
              >
                👨‍🍳 Preparing
              </button>
              `
              :
              ""
            }


            ${
              status !== "ready"
              &&
              status !== "delivered"
              &&
              status !== "cancelled"
              ?
              `
              <button
                class="action-btn ready"
                onclick="changeStatus('${order.id}', 'ready')"
              >
                ✅ Ready
              </button>
              `
              :
              ""
            }


            ${
              status !== "delivered"
              &&
              status !== "cancelled"
              ?
              `
              <button
                class="action-btn deliver"
                onclick="changeStatus('${order.id}', 'delivered')"
              >
                🚚 Delivered
              </button>
              `
              :
              ""
            }


            ${
              status !== "cancelled"
              &&
              status !== "delivered"
              ?
              `
              <button
                class="action-btn cancel"
                onclick="changeStatus('${order.id}', 'cancelled')"
              >
                ❌ Cancel
              </button>
              `
              :
              ""
            }

          </div>

        </div>

      `;

    }


    /* ==========================================
       CHANGE ORDER STATUS
       ========================================== */

    window.changeStatus =
      async function(orderId, newStatus) {

        try {

          await updateDoc(
            doc(db, "orders", orderId),

            {
              status: newStatus,

              updatedAt: serverTimestamp()

            }

          );

        }

        catch (error) {

          alert(
            "Status update failed:\n" +
            error.message
          );

          console.error(error);

        }

      };


    /* ==========================================
       FILTER BUTTONS
       ========================================== */

    document
      .querySelectorAll(".filter-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );


            button.classList.add("active");


            currentFilter =
              button.dataset.filter;


            renderOrders();

          }
        );

      });


    /* ==========================================
       REFRESH
       ========================================== */

    document
      .getElementById("refreshBtn")
      .addEventListener("click", () => {

        renderOrders();

        updateStats();

      });


    /* ==========================================
       NEW ORDER SOUND
       ========================================== */

    function playNewOrderSound() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        const audioContext =
          new AudioContext();


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          700,
          audioContext.currentTime
        );

        oscillator.frequency.setValueAtTime(
          950,
          audioContext.currentTime + .15
        );

        oscillator.frequency.setValueAtTime(
          700,
          audioContext.currentTime + .30
        );


        gain.gain.setValueAtTime(
          .001,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          .35,
          audioContext.currentTime + .03
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          audioContext.currentTime + .6
        );


        oscillator.connect(gain);

        gain.connect(
          audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + .65
        );

      }

      catch (error) {

        console.log(
          "Sound unavailable",
          error
        );

      }

    }


    /* ==========================================
       POPUP
       ========================================== */

    function showNewOrderPopup(order) {

      const popup =
        document.getElementById("popup");


      const popupText =
        document.getElementById("popupText");


      popupText.innerHTML = `

        Order
        <strong>
          #${escapeHtml(
            order?.orderNumber || ""
          )}
        </strong>
        received!<br><br>

        Customer:
        ${escapeHtml(
          order?.customerName || "-"
        )}

      `;


      popup.classList.add("show");


      setTimeout(() => {

        popup.classList.remove("show");

      }, 7000);

    }


    window.closePopup =
      function() {

        document
          .getElementById("popup")
          .classList.remove("show");

      };


    /* ==========================================
       BROWSER NOTIFICATION
       ========================================== */

    async function sendBrowserNotification(order) {

      try {

        if (
          !("Notification" in window)
        ) {

          return;

        }


        if (
          Notification.permission ===
          "default"
        ) {

          await Notification.requestPermission();

        }


        if (
          Notification.permission ===
          "granted"
        ) {

          new Notification(
            "🍕 Pizza Inn — New Order",
            {

              body:
                "Order #" +
                (
                  order?.orderNumber || ""
                ) +
                " from " +
                (
                  order?.customerName ||
                  "Customer"
                ),

              icon:
                "pizza-inn-menu-qr.png"

            }

          );

        }

      }

      catch (error) {

        console.log(
          "Notification unavailable",
          error
        );

      }

    }


    /* ==========================================
       FORMAT DATE
       ========================================== */

    function formatDate(timestamp) {

      if (!timestamp) {

        return "Just now";

      }


      try {

        const date =
          timestamp.toDate
          ?
          timestamp.toDate()
          :
          new Date(timestamp);


        return date.toLocaleString(
          "en-PK",
          {

            dateStyle: "medium",

            timeStyle: "short"

          }
        );

      }

      catch (error) {

        return "Unknown time";

      }

    }


    /* ==========================================
       SECURITY / HTML ESCAPE
       ========================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

  </script>
