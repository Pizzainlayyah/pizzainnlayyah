<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza Inn — Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff9e7;
  color:#201d1d;
}

button,input{font:inherit}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 10% 10%,#f7c60055 0 120px,transparent 121px),
    radial-gradient(circle at 90% 90%,#df202755 0 150px,transparent 151px),
    #fff9e7;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:35px;
  border-radius:25px;
  box-shadow:0 20px 60px #0003;
  text-align:center;
}

.logo{
  font-size:65px;
}

.login-box h1{
  margin:5px 0;
  font-size:30px;
}

.login-box p{
  color:#777;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:2px solid #eee;
  border-radius:12px;
  outline:none;
}

.input:focus{
  border-color:#f7c600;
}

.login-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#df2027;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
}

.error{
  color:#df2027;
  font-weight:bold;
  margin-top:15px;
  min-height:22px;
}

/* ADMIN */

#adminPage{
  display:none;
}

header{
  background:linear-gradient(135deg,#f7c600,#ffe45b,#f7c600);
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 5px 20px #0002;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  font-size:38px;
}

.brand-title{
  font-size:24px;
  font-weight:900;
}

.brand-title span{
  color:#df2027;
}

.brand-sub{
  font-size:11px;
}

.actions{
  display:flex;
  gap:8px;
}

.action-btn{
  border:0;
  padding:10px 15px;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
}

.sound{
  background:#fff;
}

.logout{
  background:#df2027;
  color:#fff;
}

.container{
  max-width:1350px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.top h1{
  margin:0;
}

.live{
  background:#e4ffed;
  color:#159447;
  padding:9px 15px;
  border-radius:999px;
  font-weight:900;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px #0001;
}

.stat-icon{
  font-size:28px;
}

.stat-number{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.stat-name{
  color:#777;
  font-weight:bold;
}

/* FILTER */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  background:#fff;
  padding:12px;
  border-radius:15px;
  margin-bottom:20px;
}

.filter{
  border:0;
  background:#eee;
  padding:9px 15px;
  border-radius:999px;
  cursor:pointer;
  font-weight:900;
}

.filter.active{
  background:#df2027;
  color:#fff;
}

/* ORDERS */

.orders{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:18px;
}

.order{
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 7px 25px #0001;
  border-left:6px solid #f7c600;
  animation:show .35s ease;
}

.order.new{
  border-left-color:#df2027;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.order-number{
  font-size:22px;
  font-weight:900;
  color:#df2027;
}

.time{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  height:max-content;
}

.badge-new{
  background:#ffe0e0;
  color:#df2027;
}

.badge-preparing{
  background:#fff0c4;
  color:#9a6500;
}

.badge-ready{
  background:#dceeff;
  color:#1265a8;
}

.badge-delivered{
  background:#dcf8e5;
  color:#159447;
}

.badge-cancelled{
  background:#eee;
  color:#666;
}

.type{
  display:inline-block;
  margin-top:12px;
  padding:7px 10px;
  background:#fff4c5;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.customer{
  background:#fafafa;
  padding:12px;
  border-radius:12px;
  margin:12px 0;
  line-height:1.7;
}

.items{
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
}

.item-name{
  font-weight:800;
}

.option{
  color:#777;
  font-size:13px;
}

.price{
  font-weight:900;
  white-space:nowrap;
}

.total{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  font-size:20px;
  font-weight:900;
  color:#df2027;
}

.notes{
  background:#fff9e7;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
}

.status-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.status-btn{
  border:0;
  padding:11px 5px;
  border-radius:10px;
  cursor:pointer;
  font-weight:900;
}

.preparing{
  background:#fff0c4;
}

.ready{
  background:#dceeff;
}

.delivered{
  background:#dcf8e5;
}

.cancelled{
  background:#ffe0e0;
  color:#df2027;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  padding:60px 20px;
  border-radius:20px;
  text-align:center;
  color:#777;
}

.empty-icon{
  font-size:65px;
}

/* POPUP */

.popup{
  position:fixed;
  top:90px;
  right:20px;
  width:min(380px,calc(100% - 40px));
  background:#fff;
  border-left:6px solid #df2027;
  border-radius:18px;
  padding:18px;
  box-shadow:0 15px 50px #0004;
  z-index:9999;
  transform:translateX(450px);
  transition:.4s ease;
}

.popup.show{
  transform:translateX(0);
}

.popup h2{
  margin:0 0 8px;
  color:#df2027;
}

.popup button{
  border:0;
  background:#df2027;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* LOADING */

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

/* ANIMATION */

@keyframes show{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@media(max-width:800px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  header{
    flex-wrap:wrap;
  }

  .brand-title{
    font-size:19px;
  }
}

@media(max-width:500px){
  .container{
    padding:12px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    padding:14px;
  }

  .stat-number{
    font-size:23px;
  }

  .orders{
    grid-template-columns:1fr;
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

  <div class="login-box">

    <div class="logo">🍕</div>

    <h1>Pizza Inn Admin</h1>

    <p>Restaurant Management Panel</p>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">
      🔐 LOGIN
    </button>

    <div class="error" id="loginError"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage">

<header>

  <div class="brand">

    <div class="brand-icon">🍕</div>

    <div>

      <div class="brand-title">
        Pizza <span>Inn</span>
      </div>

      <div class="brand-sub">
        Layyah • Admin Panel
      </div>

    </div>

  </div>

  <div class="actions">

    <button class="action-btn sound" id="soundBtn">
      🔊 Sound ON
    </button>

    <button class="action-btn logout" id="logoutBtn">
      Logout
    </button>

  </div>

</header>


<div class="container">

  <div class="top">

    <div>
      <h1>Orders Dashboard</h1>
      <div style="color:#777;margin-top:5px">
        Live restaurant orders
      </div>
    </div>

    <div class="live">
      🟢 LIVE
    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">🔔</div>
      <div class="stat-number" id="newCount">0</div>
      <div class="stat-name">New Orders</div>
    </div>

    <div class="stat">
      <div class="stat-icon">👨‍🍳</div>
      <div class="stat-number" id="preparingCount">0</div>
      <div class="stat-name">Preparing</div>
    </div>

    <div class="stat">
      <div class="stat-icon">🍕</div>
      <div class="stat-number" id="readyCount">0</div>
      <div class="stat-name">Ready</div>
    </div>

    <div class="stat">
      <div class="stat-icon">💰</div>
      <div class="stat-number" id="salesCount">Rs. 0</div>
      <div class="stat-name">Today's Sales</div>
    </div>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button class="filter active" data-filter="all">
      All
    </button>

    <button class="filter" data-filter="new">
      🔔 New
    </button>

    <button class="filter" data-filter="preparing">
      👨‍🍳 Preparing
    </button>

    <button class="filter" data-filter="ready">
      🍕 Ready
    </button>

    <button class="filter" data-filter="delivered">
      ✅ Delivered
    </button>

    <button class="filter" data-filter="cancelled">
      ❌ Cancelled
    </button>

  </div>


  <!-- ORDERS -->

  <div class="orders" id="orders">

    <div class="loading">
      Loading orders...
    </div>

  </div>

</div>

</div>


<!-- POPUP -->

<div class="popup" id="popup">

  <h2>🔔 NEW ORDER!</h2>

  <div id="popupText"></div>

  <button id="popupClose">
    View Order
  </button>

</div>


<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  updateDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:"AIzaSyB7BB5goAsfoaJfONsk4hbPJKLRLiEBRw",

  authDomain:"pizzainnlayyah.firebaseapp.com",

  projectId:"pizzainnlayyah",

  storageBucket:"pizzainnlayyah.firebasestorage.app",

  messagingSenderId:"646104115309",

  appId:"1:646104115309:web:92bdc9d7a5549068337764",

  measurementId:"G-5QLLC0TLRK"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* VARIABLES */

let orders = [];

let currentFilter = "all";

let soundEnabled = true;

let firstSnapshot = true;

let audioContext = null;

let unsubscribeOrders = null;


/* ELEMENTS */

const loginPage = document.getElementById("loginPage");

const adminPage = document.getElementById("adminPage");

const loginBtn = document.getElementById("loginBtn");

const logoutBtn = document.getElementById("logoutBtn");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginError = document.getElementById("loginError");


/* LOGIN */

async function login(){

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  loginError.textContent = "";

  if(!email){

    loginError.textContent = "Email enter karein.";

    return;

  }

  if(!password){

    loginError.textContent = "Password enter karein.";

    return;

  }

  loginBtn.disabled = true;

  loginBtn.textContent = "⏳ LOGINING...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error("LOGIN ERROR:",error);

    loginError.textContent =
      error.code
      ? "❌ "+error.code
      : "❌ "+error.message;

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent = "🔐 LOGIN";

  }

}


loginBtn.addEventListener("click",login);


passwordInput.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    login();
  }

});


/* AUTH */

onAuthStateChanged(auth,function(user){

  if(user){

    loginPage.style.display = "none";

    adminPage.style.display = "block";

    startOrders();

    requestNotifications();

  }else{

    loginPage.style.display = "flex";

    adminPage.style.display = "none";

  }

});


/* LOGOUT */

logoutBtn.addEventListener("click",async function(){

  if(unsubscribeOrders){
    unsubscribeOrders();
    unsubscribeOrders = null;
  }

  await signOut(auth);

});


/* NOTIFICATIONS */

async function requestNotifications(){

  if(!("Notification" in window)){
    return;
  }

  if(Notification.permission === "default"){

    try{
      await Notification.requestPermission();
    }catch(e){
      console.log(e);
    }

  }

}


/* SOUND */

function playSound(){

  if(!soundEnabled){
    return;
  }

  try{

    if(!audioContext){

      audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const now = audioContext.currentTime;

    const osc = audioContext.createOscillator();

    const gain = audioContext.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(880,now);

    osc.frequency.setValueAtTime(
      1174,
      now + .15
    );

    gain.gain.setValueAtTime(
      .001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .5,
      now + .03
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now + .7
    );

    osc.connect(gain);

    gain.connect(audioContext.destination);

    osc.start(now);

    osc.stop(now + .75);

  }catch(e){

    console.log("Sound error:",e);

  }

}


/* SOUND BUTTON */

document
.getElementById("soundBtn")
.addEventListener("click",function(){

  soundEnabled = !soundEnabled;

  this.textContent =
    soundEnabled
    ? "🔊 Sound ON"
    : "🔇 Sound OFF";

  if(soundEnabled){
    playSound();
  }

});


/* LIVE ORDERS */

function startOrders(){

  if(unsubscribeOrders){
    unsubscribeOrders();
  }

  firstSnapshot = true;

  const ordersQuery = query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );

  unsubscribeOrders = onSnapshot(

    ordersQuery,

    function(snapshot){

      const incoming = [];

      snapshot.docChanges().forEach(function(change){

        if(
          change.type === "added" &&
          !firstSnapshot
        ){

          const order = change.doc.data();

          if(order.status === "new"){
            incoming.push(order);
          }

        }

      });


      orders = snapshot.docs.map(function(item){

        return {
          id:item.id,
          ...item.data()
        };

      });


      updateStats();

      renderOrders();


      if(incoming.length){

        incoming.forEach(function(order){

          newOrderAlert(order);

        });

      }


      firstSnapshot = false;

    },

    function(error){

      console.error("FIRESTORE ERROR:",error);

      document.getElementById("orders").innerHTML = `

        <div class="empty">

          <div class="empty-icon">⚠️</div>

          <h2>Orders Load Nahi Ho Rahe</h2>

          <p>
            Firebase Firestore rules ya connection check karein.
          </p>

        </div>

      `;

    }

  );

}


/* NEW ORDER */

function newOrderAlert(order){

  playSound();

  const popup = document.getElementById("popup");

  const text = document.getElementById("popupText");

  text.innerHTML = `

    <strong>
      Order #${escapeHTML(order.orderNumber || "NEW")}
    </strong>

    <br>

    👤 ${escapeHTML(order.customerName || "Customer")}

    <br>

    📞 ${escapeHTML(order.phone || "")}

    <br>

    💰 Rs. ${Number(order.total || 0).toLocaleString()}

  `;

  popup.classList.add("show");


  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    try{

      new Notification(
        "🍕 Pizza Inn — NEW ORDER!",
        {
          body:
            "Order #"+
            (order.orderNumber || "NEW")+
            " • Rs. "+
            (order.total || 0)
        }
      );

    }catch(e){

      console.log(e);

    }

  }


  setTimeout(function(){

    popup.classList.remove("show");

  },10000);

}


document
.getElementById("popupClose")
.addEventListener("click",function(){

  document
    .getElementById("popup")
    .classList.remove("show");

});


/* STATS */

function updateStats(){

  const newOrders =
    orders.filter(x=>x.status==="new").length;

  const preparing =
    orders.filter(x=>x.status==="preparing").length;

  const ready =
    orders.filter(x=>x.status==="ready").length;


  document.getElementById("newCount")
    .textContent = newOrders;

  document.getElementById("preparingCount")
    .textContent = preparing;

  document.getElementById("readyCount")
    .textContent = ready;


  const now = new Date();

  const start = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );


  let sales = 0;


  orders.forEach(function(order){

    if(
      order.status === "cancelled" ||
      !order.createdAt
    ){
      return;
    }

    try{

      const date = order.createdAt.toDate();

      if(date >= start){
        sales += Number(order.total || 0);
      }

    }catch(e){}

  });


  document.getElementById("salesCount")
    .textContent =
      "Rs. "+sales.toLocaleString();

}


/* FILTER */

document
.querySelectorAll(".filter")
.forEach(function(button){

  button.addEventListener("click",function(){

    document
      .querySelectorAll(".filter")
      .forEach(function(x){
        x.classList.remove("active");
      });

    this.classList.add("active");

    currentFilter =
      this.dataset.filter;

    renderOrders();

  });

});


/* RENDER */

function renderOrders(){

  const box =
    document.getElementById("orders");

  let list = [...orders];


  if(currentFilter !== "all"){

    list =
      list.filter(function(order){

        return order.status === currentFilter;

      });

  }


  if(!list.length){

    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">🍕</div>

        <h2>No Orders</h2>

        <p>
          Abhi is category mein koi order nahi hai.
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML = "";


  list.forEach(function(order){

    const card =
      document.createElement("div");

    const status =
      order.status || "new";

    card.className =
      "order "+
      (status === "new" ? "new" : "");


    let itemsHTML = "";

    const items =
      Array.isArray(order.items)
      ? order.items
      : [];


    items.forEach(function(item){

      const quantity =
        Number(
          item.quantity ||
          item.qty ||
          1
        );

      const itemPrice =
        Number(item.price || 0);

      const subtotal =
        Number(item.subtotal) ||
        itemPrice * quantity;


      itemsHTML += `

        <div class="item">

          <div>

            <div class="item-name">
              ${quantity} ×
              ${escapeHTML(item.name || "")}
            </div>

            ${
              item.option
              ? `<div class="option">
                  ${escapeHTML(item.option)}
                </div>`
              : ""
            }

          </div>

          <div class="price">
            Rs. ${subtotal.toLocaleString()}
          </div>

        </div>

      `;

    });


    let orderType = "🥡 TAKEAWAY";

    if(order.orderType === "dine-in"){
      orderType = "🪑 DINE-IN";
    }

    if(order.orderType === "delivery"){
      orderType = "🏠 DELIVERY";
    }


    card.innerHTML = `

      <div class="order-head">

        <div>

          <div class="order-number">
            #${escapeHTML(
              order.orderNumber ||
              order.id.slice(-6)
            )}
          </div>

          <div class="time">
            ${formatTime(order.createdAt)}
          </div>

        </div>

        <div class="badge badge-${status}">
          ${escapeHTML(status)}
        </div>

      </div>


      <div class="type">
        ${orderType}
      </div>


      <div class="customer">

        <div>
          👤 <strong>
            ${escapeHTML(
              order.customerName ||
              "Customer"
            )}
          </strong>
        </div>

        <div>
          📞 ${escapeHTML(order.phone || "")}
        </div>

        ${
          order.tableNumber
          ? `
            <div>
              🪑 Table:
              <strong>
                ${escapeHTML(order.tableNumber)}
              </strong>
            </div>
          `
          : ""
        }

        ${
          order.address
          ? `
            <div>
              🏠 ${escapeHTML(order.address)}
            </div>
          `
          : ""
        }

      </div>


      <div class="items">

        ${itemsHTML}

      </div>


      ${
        order.notes
        ? `
          <div class="notes">
            📝 <strong>Note:</strong>
            ${escapeHTML(order.notes)}
          </div>
        `
        : ""
      }


      <div class="total">

        <span>Total</span>

        <span>
          Rs.
          ${Number(
            order.total || 0
          ).toLocaleString()}
        </span>

      </div>


      <div class="status-buttons">

        ${
          status !== "preparing"
          ? `
            <button
              class="status-btn preparing"
              data-id="${order.id}"
              data-status="preparing">
              👨‍🍳 Preparing
            </button>
          `
          : ""
        }

        ${
          status !== "ready"
          ? `
            <button
              class="status-btn ready"
              data-id="${order.id}"
              data-status="ready">
              🍕 Ready
            </button>
          `
          : ""
        }

        ${
          status !== "delivered"
          ? `
            <button
              class="status-btn delivered"
              data-id="${order.id}"
              data-status="delivered">
              ✅ Delivered
            </button>
          `
          : ""
        }

        ${
          status !== "cancelled"
          ? `
            <button
              class="status-btn cancelled"
              data-id="${order.id}"
              data-status="cancelled">
              ❌ Cancel
            </button>
          `
          : ""
        }

      </div>

    `;


    box.appendChild(card);

  });


  document
    .querySelectorAll(".status-btn")
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(){

          changeStatus(
            this.dataset.id,
            this.dataset.status
          );

        }
      );

    });

}


/* CHANGE STATUS */

async function changeStatus(id,status){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:status,
        updatedAt:new Date()
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Status update nahi ho saka."
    );

  }

}


/* TIME */

function formatTime(timestamp){

  if(!timestamp){
    return "Just now";
  }

  try{

    return timestamp
      .toDate()
      .toLocaleString(
        "en-PK",
        {
          day:"2-digit",
          month:"short",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }catch(e){

    return "Just now";

  }

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
