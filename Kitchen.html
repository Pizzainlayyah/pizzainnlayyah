<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Inn — Kitchen Display</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #14100f;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    /* LOGIN */
    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #df2027, #f7c600);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #201d1d;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
      text-align: center;
      animation: pop .5s ease;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .login-box h1 {
      color: #f7c600;
      margin-bottom: 5px;
    }

    .login-box p {
      color: #999;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #2b2727;
      color: #fff;
    }

    .login-box input:focus {
      border-color: #f7c600;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #df2027;
      color: white;
      font-size: 17px;
      font-weight: bold;
      transition: .2s;
    }

    .login-btn:hover {
      background: #b9161c;
      transform: translateY(-2px);
    }

    #loginError {
      margin-top: 15px;
      color: #ff6b6b;
      font-size: 14px;
      line-height: 1.5;
    }

    /* KITCHEN PAGE */
    #kitchenPage {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #201d1d;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 15px rgba(0,0,0,.4);
      border-bottom: 3px solid #f7c600;
    }

    .header-inner {
      max-width: 1600px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 34px;
    }

    .brand h1 {
      font-size: 22px;
      color: #fff;
    }

    .brand small {
      display: block;
      color: #f7c600;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #clock {
      font-size: 20px;
      font-weight: bold;
      color: #f7c600;
      letter-spacing: 1px;
    }

    .logout-btn {
      background: #df2027;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #b9161c;
    }

    .container {
      max-width: 1600px;
      margin: auto;
      padding: 20px;
    }

    /* TOOLBAR */
    .toolbar {
      background: #201d1d;
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: 12px 18px;
      border-radius: 8px;
      background: #2b2727;
      color: #ccc;
      font-weight: bold;
      font-size: 15px;
    }

    .filter-btn.active {
      background: #df2027;
      color: white;
    }

    .count-badge {
      background: rgba(255,255,255,.15);
      padding: 2px 9px;
      border-radius: 10px;
      margin-left: 6px;
      font-size: 13px;
    }

    .sound-toggle {
      margin-left: auto;
      padding: 12px 16px;
      background: #2b2727;
      color: #ccc;
      border-radius: 8px;
      font-weight: bold;
    }

    .sound-toggle.on {
      background: #16833a;
      color: #fff;
    }

    /* ORDERS GRID */
    #ordersContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
    }

    .order-card {
      background: #201d1d;
      border-radius: 18px;
      padding: 20px;
      border-left: 8px solid #f7c600;
      animation: slideUp .35s ease;
    }

    .order-card.status-new {
      border-left-color: #df2027;
      box-shadow: 0 0 0 2px rgba(223,32,39,.4);
    }

    .order-card.status-preparing {
      border-left-color: #f7c600;
    }

    .order-card.status-ready {
      border-left-color: #16833a;
      opacity: .55;
    }

    .order-card.late {
      animation: slideUp .35s ease, pulseLate 1.2s infinite;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .order-number {
      color: #f7c600;
      font-size: 26px;
      font-weight: bold;
    }

    .order-timer {
      font-size: 13px;
      margin-top: 4px;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 12px;
      display: inline-block;
    }

    .timer-ok {
      background: #16512a;
      color: #6bd98a;
    }

    .timer-warn {
      background: #6b5300;
      color: #ffd75e;
    }

    .timer-late {
      background: #5c1315;
      color: #ff8080;
    }

    .status-pill {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-pill.status-new {
      background: #df2027;
      color: white;
    }

    .status-pill.status-preparing {
      background: #f7c600;
      color: #201d1d;
    }

    .status-pill.status-ready {
      background: #16833a;
      color: white;
    }

    .meta-row {
      background: #2b2727;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      line-height: 1.7;
      font-size: 14px;
      color: #ddd;
    }

    .meta-row strong {
      color: #f7c600;
    }

    .items h3 {
      margin-bottom: 8px;
      font-size: 15px;
      color: #aaa;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed #3a3535;
      font-size: 17px;
    }

    .item-name {
      font-weight: bold;
    }

    .item-option {
      color: #999;
      font-size: 13px;
      display: block;
      margin-top: 2px;
    }

    .item-qty {
      white-space: nowrap;
      font-weight: bold;
      color: #f7c600;
    }

    .notes-box {
      background: #4a2600;
      color: #ffd28a;
      padding: 10px 12px;
      border-radius: 8px;
      margin: 12px 0;
      font-size: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .action-btn {
      padding: 16px 8px;
      border-radius: 10px;
      font-weight: bold;
      color: white;
      font-size: 17px;
    }

    .prepare {
      background: #f7c600;
      color: #201d1d;
    }

    .ready {
      background: #16833a;
    }

    .action-btn:active {
      transform: scale(.97);
    }

    .done-label {
      text-align: center;
      padding: 14px;
      color: #6bd98a;
      font-weight: bold;
      font-size: 16px;
    }

    .empty {
      grid-column: 1 / -1;
      background: #201d1d;
      padding: 60px 20px;
      text-align: center;
      border-radius: 18px;
      color: #999;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(20,16,15,.92);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 5px solid #333;
      border-top-color: #f7c600;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    /* ANIMATIONS */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseLate {
      0%, 100% { box-shadow: 0 0 0 2px rgba(223,32,39,.5); }
      50% { box-shadow: 0 0 0 6px rgba(223,32,39,.15); }
    }

    @media (max-width: 600px) {
      #ordersContainer {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      #clock {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div id="loading">
    <div class="loader"></div>
    <strong>Loading...</strong>
  </div>

  <!-- LOGIN PAGE -->
  <section id="loginPage">
    <div class="login-box">
      <div class="logo">👨‍🍳</div>
      <h1>Pizza Inn</h1>
      <p>Kitchen Display</p>

      <input type="email" id="email" placeholder="Kitchen Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">

      <button class="login-btn" id="loginBtn">🔐 Login</button>

      <div id="loginError"></div>
    </div>
  </section>

  <!-- KITCHEN PAGE -->
  <section id="kitchenPage">

    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">🍕</div>
          <div>
            <h1>Kitchen Display</h1>
            <small>Layyah • Live Orders</small>
          </div>
        </div>

        <div class="header-right">
          <div id="clock">--:--:--</div>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">

      <div class="toolbar">
        <button class="filter-btn active" data-filter="active">
          🔥 Active <span class="count-badge" id="activeCount">0</span>
        </button>

        <button class="filter-btn" data-filter="new">
          🆕 New <span class="count-badge" id="newCount">0</span>
        </button>

        <button class="filter-btn" data-filter="preparing">
          👨‍🍳 Preparing <span class="count-badge" id="preparingCount">0</span>
        </button>

        <button class="filter-btn" data-filter="ready">
          ✅ Ready <span class="count-badge" id="readyCount">0</span>
        </button>

        <button class="sound-toggle on" id="soundToggle">🔊 Sound On</button>
      </div>

      <div id="ordersContainer">
        <div class="empty">
          <div class="empty-icon">🍕</div>
          <h2>Loading Orders...</h2>
        </div>
      </div>

    </main>

  </section>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      updateDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    /* ==========================================
       FIREBASE CONFIG (same project as admin panel)
       ========================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyB7BB5goAsfoaJfLONsk4hbPJKLRLiEBRw",
      authDomain: "pizzainnlayyah.firebaseapp.com",
      projectId: "pizzainnlayyah",
      storageBucket: "pizzainnlayyah.firebasestorage.app",
      messagingSenderId: "646104115309",
      appId: "1:646104115309:web:92bdc9d7a5549068337764",
      measurementId: "G-5QLLC0TLRK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ==========================================
       ELEMENTS
       ========================================== */

    const loginPage = document.getElementById("loginPage");
    const kitchenPage = document.getElementById("kitchenPage");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginError = document.getElementById("loginError");
    const ordersContainer = document.getElementById("ordersContainer");
    const loading = document.getElementById("loading");
    const soundToggle = document.getElementById("soundToggle");

    /* ==========================================
       VARIABLES
       ========================================== */

    let allOrders = [];
    let currentFilter = "active";
    let firstSnapshot = true;
    let soundOn = true;
    let tickInterval = null;

    /* ==========================================
       LOGIN
       ========================================== */

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      loginError.textContent = "";

      if (!email || !password) {
        loginError.textContent = "⚠️ Email aur password dono enter karein.";
        return;
      }

      try {
        loading.style.display = "flex";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        loginError.textContent = "❌ " + (error.code || error.message);
      } finally {
        loading.style.display = "none";
      }
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") loginBtn.click();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginPage.style.display = "none";
        kitchenPage.style.display = "block";
        startOrdersListener();
        startClock();
      } else {
        loginPage.style.display = "flex";
        kitchenPage.style.display = "none";
        if (tickInterval) clearInterval(tickInterval);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    /* ==========================================
       CLOCK
       ========================================== */

    function startClock() {
      const clockEl = document.getElementById("clock");
      const update = () => {
        clockEl.textContent = new Date().toLocaleTimeString("en-PK", { hour12: true });
      };
      update();
      tickInterval = setInterval(() => {
        update();
        renderOrders(); // refresh timers + late highlighting every tick
      }, 1000);
    }

    /* ==========================================
       ORDERS LISTENER
       (kitchen only cares about new + preparing + ready,
       never sees delivered / cancelled)
       ========================================== */

    function startOrdersListener() {
      const ordersQuery = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );

      onSnapshot(
        ordersQuery,
        (snapshot) => {
          const newOrders = [];
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data.status === "delivered" || data.status === "cancelled") return;
            newOrders.push({ id: docSnap.id, ...data });
          });

          if (!firstSnapshot && newOrders.length > allOrders.length) {
            playNewOrderSound();
          }

          allOrders = newOrders;
          firstSnapshot = false;
          updateStats();
          renderOrders();
        },
        (error) => {
          console.error("Firestore error:", error);
          ordersContainer.innerHTML = `
            <div class="empty">
              <div class="empty-icon">⚠️</div>
              <h2>Orders Load Error</h2>
              <p>${escapeHtml(error.message)}</p>
            </div>
          `;
        }
      );
    }

    /* ==========================================
       STATS
       ========================================== */

    function updateStats() {
      let newCount = 0, preparingCount = 0, readyCount = 0;

      allOrders.forEach((order) => {
        if (order.status === "new") newCount++;
        if (order.status === "preparing") preparingCount++;
        if (order.status === "ready") readyCount++;
      });

      document.getElementById("newCount").textContent = newCount;
      document.getElementById("preparingCount").textContent = preparingCount;
      document.getElementById("readyCount").textContent = readyCount;
      document.getElementById("activeCount").textContent = newCount + preparingCount;
    }

    /* ==========================================
       RENDER ORDERS
       ========================================== */

    function renderOrders() {
      let orders = [...allOrders];

      if (currentFilter === "active") {
        orders = orders.filter(o => o.status === "new" || o.status === "preparing");
      } else if (currentFilter !== "all") {
        orders = orders.filter(o => (o.status || "new") === currentFilter);
      }

      // oldest first so kitchen prioritizes waiting orders
      orders.sort((a, b) => getOrderMillis(a) - getOrderMillis(b));

      if (!orders.length) {
        ordersContainer.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🍕</div>
            <h2>No Orders Here</h2>
            <p>Kitchen is clear for this filter.</p>
          </div>
        `;
        return;
      }

      ordersContainer.innerHTML = orders.map(createOrderCard).join("");
    }

    /* ==========================================
       ORDER CARD
       ========================================== */

    function getOrderMillis(order) {
      try {
        if (order.createdAt?.toDate) return order.createdAt.toDate().getTime();
      } catch (e) {}
      return 0;
    }

    function getElapsedMinutes(order) {
      const ms = getOrderMillis(order);
      if (!ms) return 0;
      return Math.floor((Date.now() - ms) / 60000);
    }

    function createOrderCard(order) {
      const status = order.status || "new";
      const orderNumber = order.orderNumber || order.id.substring(0, 8);
      const elapsed = getElapsedMinutes(order);

      let timerClass = "timer-ok";
      let isLate = false;
      if (elapsed >= 15) { timerClass = "timer-late"; isLate = true; }
      else if (elapsed >= 8) { timerClass = "timer-warn"; }

      const itemsHtml = (order.items || []).map(item => `
        <div class="item">
          <div>
            <span class="item-name">${escapeHtml(item.name || "")}</span>
            ${item.option ? `<span class="item-option">${escapeHtml(item.option)}</span>` : ""}
          </div>
          <div class="item-qty">x${Number(item.quantity || 1)}</div>
        </div>
      `).join("");

      const orderType = order.orderType || "dine-in";
      const typeText = {
        "dine-in": "🍽️ Dine In",
        "takeaway": "🥡 Takeaway",
        "delivery": "🛵 Delivery"
      }[orderType] || orderType;

      let actionsHtml = "";
      if (status === "new") {
        actionsHtml = `
          <div class="actions">
            <button class="action-btn prepare" onclick="changeStatus('${order.id}', 'preparing')">
              👨‍🍳 Start Preparing
            </button>
          </div>
        `;
      } else if (status === "preparing") {
        actionsHtml = `
          <div class="actions">
            <button class="action-btn ready" onclick="changeStatus('${order.id}', 'ready')">
              ✅ Mark Ready
            </button>
          </div>
        `;
      } else if (status === "ready") {
        actionsHtml = `<div class="done-label">✅ Ready — waiting for pickup</div>`;
      }

      return `
        <div class="order-card status-${status} ${isLate ? "late" : ""}">
          <div class="order-top">
            <div>
              <div class="order-number">#${escapeHtml(orderNumber)}</div>
              <div class="order-timer ${timerClass}">⏱ ${elapsed} min</div>
            </div>
            <div class="status-pill status-${status}">${escapeHtml(status)}</div>
          </div>

          <div class="meta-row">
            <div>🍴 <strong>Type:</strong> ${escapeHtml(typeText)}</div>
            ${order.tableNumber ? `<div>🪑 <strong>Table:</strong> ${escapeHtml(order.tableNumber)}</div>` : ""}
            ${order.customerName ? `<div>👤 <strong>Name:</strong> ${escapeHtml(order.customerName)}</div>` : ""}
          </div>

          <div class="items">
            <h3>ORDER ITEMS</h3>
            ${itemsHtml || "<p>No items found.</p>"}
          </div>

          ${order.notes ? `<div class="notes-box">📝 ${escapeHtml(order.notes)}</div>` : ""}

          ${actionsHtml}
        </div>
      `;
    }

    /* ==========================================
       CHANGE ORDER STATUS
       ========================================== */

    window.changeStatus = async function(orderId, newStatus) {
      try {
        await updateDoc(doc(db, "orders", orderId), {
          status: newStatus,
          updatedAt: serverTimestamp()
        });
      } catch (error) {
        alert("Status update failed:\n" + error.message);
        console.error(error);
      }
    };

    /* ==========================================
       FILTER BUTTONS
       ========================================== */

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        currentFilter = button.dataset.filter;
        renderOrders();
      });
    });

    /* ==========================================
       SOUND TOGGLE
       ========================================== */

    soundToggle.addEventListener("click", () => {
      soundOn = !soundOn;
      soundToggle.textContent = soundOn ? "🔊 Sound On" : "🔇 Sound Off";
      soundToggle.classList.toggle("on", soundOn);
    });

    /* ==========================================
       NEW ORDER SOUND (repeats twice, louder — kitchen is noisy)
       ========================================== */

    function playNewOrderSound() {
      if (!soundOn) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        const beep = (startTime) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(750, startTime);
          oscillator.frequency.setValueAtTime(1000, startTime + .15);
          oscillator.frequency.setValueAtTime(750, startTime + .30);

          gain.gain.setValueAtTime(.001, startTime);
          gain.gain.exponentialRampToValueAtTime(.5, startTime + .03);
          gain.gain.exponentialRampToValueAtTime(.001, startTime + .6);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          oscillator.start(startTime);
          oscillator.stop(startTime + .65);
        };

        beep(audioContext.currentTime);
        beep(audioContext.currentTime + .8);
      } catch (error) {
        console.log("Sound unavailable", error);
      }
    }

    /* ==========================================
       SECURITY / HTML ESCAPE
       ========================================== */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

  </script>
